// ---- Bulk data load from Supabase (replaces old localStorage load) ----
async function loadAppData() {
    const [clientsRes, vendorsRes, txnRes, bankRes, companyRes, profilesRes] = await Promise.all([
        sb.from('clients').select('*').order('created_at'),
        sb.from('vendors').select('*').order('created_at'),
        sb.from('transactions').select('*').order('date', { ascending: false }),
        sb.from('bank_entries').select('*').order('date', { ascending: false }),
        sb.from('company_settings').select('*').eq('id', 1).maybeSingle(),
        sb.from('profiles').select('*').order('created_at')
    ]);
    [clientsRes, vendorsRes, txnRes, bankRes, companyRes, profilesRes].forEach(r => { if (r.error) console.error('Supabase load error:', r.error); });
    state.clients = (clientsRes.data || []).map(dbClientToApp);
    state.vendors = (vendorsRes.data || []).map(dbClientToApp);
    state.transactions = (txnRes.data || []).map(dbTxnToApp);
    state.bankEntries = (bankRes.data || []).map(dbBankToApp);
    state.company = companyRes.data ? dbCompanyToApp(companyRes.data) : defaultCompany();
    state.users = (profilesRes.data || []).map(dbProfileToApp);
}

// Determine CGST+SGST (intra-state) vs IGST (inter-state) per Sec 7/8 IGST Act, 2017
function computeGstSplit(taxableValue, ratePercent, clientStateCode, companyStateCode) {
    const tv = parseFloat(taxableValue) || 0;
    const rate = parseFloat(ratePercent) || 0;
    const gstAmt = round2(tv * rate / 100);
    const intraState = clientStateCode && companyStateCode && clientStateCode === companyStateCode;
    if (intraState) {
        return { cgst: round2(gstAmt / 2), sgst: round2(gstAmt / 2), igst: 0, gstAmount: gstAmt, intraState: true };
    }
    return { cgst: 0, sgst: 0, igst: gstAmt, gstAmount: gstAmt, intraState: false };
}

function round2(n) {
    return Math.round((parseFloat(n) || 0) * 100) / 100;
}

// --- WhatsApp sharing helpers (used by Invoice Generation and Ledger tabs) ---
// Normalizes a stored phone number into a WhatsApp-callable number (assumes India +91
// when a bare 10-digit number is stored, since that's how numbers are entered in Clients/Vendors).
function formatWhatsAppNumber(raw) {
    if (!raw) return '';
    let digits = String(raw).replace(/\D/g, '');
    if (!digits) return '';
    if (digits.length === 10) digits = '91' + digits;
    else if (digits.length === 11 && digits.startsWith('0')) digits = '91' + digits.slice(1);
    return digits;
}

function openWhatsAppShare(phoneRaw, message, missingLabel) {
    const phone = formatWhatsAppNumber(phoneRaw);
    if (!phone) {
        alert(`No WhatsApp/phone number registered for this ${missingLabel}. Add one under ${missingLabel === 'vendor' ? 'Vendors' : 'Clients'}.`);
        return;
    }
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
}

function getFYLabel(startYear) {
    return `FY${startYear}-${String((startYear + 1) % 100).padStart(2, '0')}`;

function getFYStartYear(dateStr) {
    if (!dateStr) return DASHBOARD_MIN_FY_START;
    const d = new Date(dateStr);
    const y = d.getFullYear();
    const m = d.getMonth() + 1; // 1-12
    return m >= 4 ? y : y - 1;
}

// List of FY start-years to offer in the dashboard filter: always starts at
// DASHBOARD_MIN_FY_START and extends to cover today's FY and any transaction data.
function getAvailableFYs() {
    let maxFYStart = Math.max(DASHBOARD_MIN_FY_START, getFYStartYear(new Date().toISOString().split('T')[0]));
    state.transactions.forEach(t => {
        if (t.date) {
            const s = getFYStartYear(t.date);
            if (s > maxFYStart) maxFYStart = s;
        }
    });
    const fys = [];
    for (let y = DASHBOARD_MIN_FY_START; y <= maxFYStart; y++) fys.push(y);
    return fys;
}

function defaultDashboardFY() {
    const today = getFYStartYear(new Date().toISOString().split('T')[0]);
    return Math.max(DASHBOARD_MIN_FY_START, today);
}

// Sum a transaction field across a date-key predicate for a given type.
function sumTransactions(type, matchFn) {
    return state.transactions
        .filter(t => t.type === type && matchFn(t.date || ''))
        .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
}

function getMonthlyTrendData(fyStart) {
    const labels = [];
    const salesData = [];
    const purchaseData = [];
    for (let i = 0; i < 12; i++) {
        const monthIndex0 = (3 + i) % 12; // April = index 3 (Jan=0)
        const year = fyStart + Math.floor((3 + i) / 12);
        const month = monthIndex0 + 1;
        const key = `${year}-${String(month).padStart(2, '0')}`;
        const label = new Date(year, month - 1, 1).toLocaleString('en-IN', { month: 'short' }) + " '" + String(year).slice(-2);
        labels.push(label);
        salesData.push(round2(sumTransactions('sales', d => d.slice(0, 7) === key)));
        purchaseData.push(round2(sumTransactions('purchase', d => d.slice(0, 7) === key)));
    }
    return { labels, salesData, purchaseData };
}

function getQuarterlyTrendData(fyStart) {
    const quarters = [
        { label: 'Apr-Jun', months: [4, 5, 6], yearOffset: 0 },
        { label: 'Jul-Sep', months: [7, 8, 9], yearOffset: 0 },
        { label: 'Oct-Dec', months: [10, 11, 12], yearOffset: 0 },
        { label: 'Jan-Mar', months: [1, 2, 3], yearOffset: 1 }
    ];
    const labels = [];
    const salesData = [];
    const purchaseData = [];
    quarters.forEach(q => {
        const year = fyStart + q.yearOffset;
        const keys = q.months.map(m => `${year}-${String(m).padStart(2, '0')}`);
        labels.push(`${q.label} ${year}`);
        salesData.push(round2(sumTransactions('sales', d => keys.includes(d.slice(0, 7)))));
        purchaseData.push(round2(sumTransactions('purchase', d => keys.includes(d.slice(0, 7)))));
    });
    return { labels, salesData, purchaseData };
}

function getYearlyTrendData() {
    const fys = getAvailableFYs();
    const labels = fys.map(y => getFYLabel(y));
    const salesData = fys.map(y => round2(sumTransactions('sales', d => getFYStartYear(d) === y)));
    const purchaseData = fys.map(y => round2(sumTransactions('purchase', d => getFYStartYear(d) === y)));
    return { labels, salesData, purchaseData };
}

// --- Banking helpers: link receipts/payments back to sales/purchase invoices ---
function invoiceReceivedAmount(transId) {
    return (state.bankEntries || [])
        .filter(b => b.type === 'receipt' && b.linkedTransactionId === transId)
        .reduce((sum, b) => sum + (parseFloat(b.amount) || 0), 0);
}

function invoicePaidAmount(transId) {
    return (state.bankEntries || [])
        .filter(b => b.type === 'payment' && b.linkedTransactionId === transId)
        .reduce((sum, b) => sum + (parseFloat(b.amount) || 0), 0);
}

// Net outstanding balance for a client: Sales invoices debit the client (they owe us),
// Purchase invoices from that party credit them (we owe them). Positive = Dr (receivable).
function clientBalance(clientId) {
    return state.transactions
        .filter(t => t.clientId === clientId)
        .reduce((bal, t) => bal + (t.type === 'sales' ? (parseFloat(t.amount) || 0) : -(parseFloat(t.amount) || 0)), 0);
}

// Net amount payable to a vendor: sum of purchase invoices linked to them (Cr = we owe them).
function vendorBalance(vendorId) {
    return state.transactions
        .filter(t => t.vendorId === vendorId && t.type === 'purchase')
        .reduce((bal, t) => bal + (parseFloat(t.amount) || 0), 0);
}

// Basic Indian numbering (Rupees) amount-to-words for invoice printing
function amountToWords(num) {
    num = Math.round(parseFloat(num) || 0);
    if (num === 0) return 'Zero Rupees Only';
    const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
        'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function twoDigits(n) {
        if (n < 20) return ones[n];
        return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
    }
    function threeDigits(n) {
        if (n >= 100) return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + twoDigits(n % 100) : '');
        return twoDigits(n);
    }
    let result = '';
    const crore = Math.floor(num / 10000000); num %= 10000000;
    const lakh = Math.floor(num / 100000); num %= 100000;
    const thousand = Math.floor(num / 1000); num %= 1000;
    const hundred = num;
    if (crore) result += threeDigits(crore) + ' Crore ';
    if (lakh) result += threeDigits(lakh) + ' Lakh ';
    if (thousand) result += threeDigits(thousand) + ' Thousand ';
    if (hundred) result += threeDigits(hundred);
    return result.trim() + ' Rupees Only';
}

// Add User (staff account). Creates a real Supabase Auth login via signUp(), then
// (if needed) promotes the resulting profile to admin. NOTE: if your Supabase project
// has "Confirm email" enabled (the default), the new person must click the confirmation
// link in their email before they can sign in — the account and password are created
// immediately either way.
async function addUser(data) {
    if (!data.name || !data.email || !data.password) {
        alert('All fields are required');
        return;
    }
    const { data: { session: adminSession } } = await sb.auth.getSession();
    const { data: signUpData, error } = await sb.auth.signUp({
        email: data.email,
        password: data.password,
        options: { data: { name: data.name } }
    });
    if (error) { alert('Error creating user: ' + error.message); return; }
    // signUp() can switch the browser's active session to the new user when email
    // confirmation is disabled on the project — switch the admin's session back.
    if (adminSession) {
        await sb.auth.setSession({ access_token: adminSession.access_token, refresh_token: adminSession.refresh_token });
    }
    if (data.role === 'admin' && signUpData.user) {
        const { error: roleErr } = await sb.from('profiles').update({ role: 'admin' }).eq('id', signUpData.user.id);
        if (roleErr) console.error('Could not set admin role:', roleErr);
    }
    await loadAppData();
    state.showUserModal = false;
    alert('User created: ' + data.email);
    renderApp();
}

// Export to Excel (Simple CSV)
function exportData(data, filename) {
    if (!data || data.length === 0) {
        alert('No data to export');
        return;
    }
    
    const headers = Object.keys(data[0]);
    const csv = [headers.join(','), ...data.map(row => headers.map(h => {
        const val = row[h] || '';
        return typeof val === 'string' && val.includes(',') ? `"${val}"` : val;
    }).join(','))].join('\n');
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename + '_' + Date.now() + '.csv';
    a.click();
}

// Round a value up to a visually clean axis maximum (1/2/5 x 10^n).
function niceCeiling(val) {
    if (!val || val <= 0) return 10;
    const exp = Math.floor(Math.log10(val));
    const base = Math.pow(10, exp);
    const fraction = val / base;
    let niceFraction;
    if (fraction <= 1) niceFraction = 1;
    else if (fraction <= 2) niceFraction = 2;
    else if (fraction <= 5) niceFraction = 5;
    else niceFraction = 10;
    return niceFraction * base;
}

// Compact Indian-style amount label for axis ticks (k / L / Cr).
function formatCompactINR(v) {
    const abs = Math.abs(v);
    if (abs >= 10000000) return (v / 10000000).toFixed(1).replace(/\.0$/, '') + 'Cr';
    if (abs >= 100000) return (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
    if (abs >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return Math.round(v).toString();
}

// Render the Sales vs Purchases trend as a self-contained inline SVG line chart.
// Drawn by hand (no external charting library) so it always renders, including
// when this file is opened locally (file://) with no internet access.
function renderTrendChartSVG(data) {
    const width = 900, height = 340;
    const paddingLeft = 64, paddingRight = 20, paddingTop = 16, paddingBottom = 44;
    const chartWidth = width - paddingLeft - paddingRight;
    const chartHeight = height - paddingTop - paddingBottom;
    const n = data.labels.length;
    const allValues = [...data.salesData, ...data.purchaseData];
    const maxVal = Math.max(0, ...allValues);
    const niceMax = niceCeiling(maxVal);

    if (maxVal === 0) {
        return `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:14px;">No sales or purchase data for this period yet</div>`;
    }

    const xStep = n > 1 ? chartWidth / (n - 1) : 0;
    const xFor = i => paddingLeft + (n > 1 ? i * xStep : chartWidth / 2);
    const yFor = v => paddingTop + chartHeight - (v / niceMax) * chartHeight;

    const gridLines = 5;
    let gridSvg = '';
    for (let g = 0; g <= gridLines; g++) {
        const v = (niceMax / gridLines) * g;
        const y = yFor(v);
        gridSvg += `<line x1="${paddingLeft}" y1="${y.toFixed(1)}" x2="${width - paddingRight}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" />`;
        gridSvg += `<text x="${paddingLeft - 8}" y="${(y + 4).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="end">₹${formatCompactINR(v)}</text>`;
    }

    let xLabelsSvg = '';
    data.labels.forEach((label, i) => {
        xLabelsSvg += `<text x="${xFor(i).toFixed(1)}" y="${height - paddingBottom + 20}" font-size="11" fill="#64748b" text-anchor="middle">${label}</text>`;
    });

    const pathFor = values => values.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i).toFixed(1)} ${yFor(v).toFixed(1)}`).join(' ');
    const pointsFor = (values, color) => values.map((v, i) => `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="4" fill="${color}"><title>${data.labels[i]}: ₹${v.toLocaleString('en-IN')}</title></circle>`).join('');

    return `
        <svg viewBox="0 0 ${width} ${height}" style="width: 100%; height: calc(100% - 26px);" preserveAspectRatio="xMidYMid meet">
            ${gridSvg}
            <line x1="${paddingLeft}" y1="${paddingTop}" x2="${paddingLeft}" y2="${height - paddingBottom}" stroke="#cbd5e1" stroke-width="1" />
            <line x1="${paddingLeft}" y1="${height - paddingBottom}" x2="${width - paddingRight}" y2="${height - paddingBottom}" stroke="#cbd5e1" stroke-width="1" />
            ${xLabelsSvg}
            <path d="${pathFor(data.salesData)}" fill="none" stroke="#16a34a" stroke-width="2.5" />
            ${pointsFor(data.salesData, '#16a34a')}
            <path d="${pathFor(data.purchaseData)}" fill="none" stroke="#dc2626" stroke-width="2.5" />

}

// --- Ageing (Payable / Receivable) ---
// No due-date field exists on invoices, so ageing is measured from the invoice date.
// Outstanding per invoice = invoice amount - linked payments (purchases) / receipts (sales).
const AGEING_BUCKETS = [
    { label: '0-30 days', min: 0, max: 30, color: '#16a34a' },
    { label: '31-60 days', min: 31, max: 60, color: '#eab308' },
    { label: '61-90 days', min: 61, max: 90, color: '#f97316' },
    { label: '90+ days', min: 91, max: Infinity, color: '#dc2626' }
];

function getAgeingData(type) {
    const isPurchase = type === 'purchase';
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const buckets = AGEING_BUCKETS.map(b => ({ ...b, amount: 0, count: 0 }));
    let total = 0, settled = 0, outstanding = 0;
    state.transactions.filter(t => t.type === type).forEach(t => {
        const amt = parseFloat(t.amount) || 0;
        const done = isPurchase ? invoicePaidAmount(t.id) : invoiceReceivedAmount(t.id);
        const due = round2(amt - done);
        total += amt;
        settled += Math.min(done, amt);
        if (due <= 0.005) return;
        outstanding += due;
        const d = t.date ? new Date(t.date) : today;
        const age = Math.max(0, Math.floor((today - d) / 86400000));
        const b = buckets.find(x => age >= x.min && age <= x.max) || buckets[buckets.length - 1];
        b.amount = round2(b.amount + due);
        b.count += 1;
    });
    return { buckets, total: round2(total), settled: round2(settled), outstanding: round2(outstanding) };
}

function renderAgeingChartSVG(data) {
    if (data.outstanding <= 0) {
        return `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:#94a3b8; font-size:14px;">No outstanding invoices</div>`;
    }
    const width = 600, height = 280;
    const pl = 64, pr = 16, pt = 16, pb = 56;
    const cw = width - pl - pr, ch = height - pt - pb;
    const niceMax = niceCeiling(Math.max(...data.buckets.map(b => b.amount)));
    const yFor = v => pt + ch - (v / niceMax) * ch;
    const slot = cw / data.buckets.length, barW = Math.min(64, slot * 0.6);
    let svg = '';
    for (let g = 0; g <= 5; g++) {
        const v = (niceMax / 5) * g, y = yFor(v);
        svg += `<line x1="${pl}" y1="${y.toFixed(1)}" x2="${width - pr}" y2="${y.toFixed(1)}" stroke="#e2e8f0" stroke-width="1" />`;
        svg += `<text x="${pl - 8}" y="${(y + 4).toFixed(1)}" font-size="11" fill="#64748b" text-anchor="end">₹${formatCompactINR(v)}</text>`;
    }
    data.buckets.forEach((b, i) => {
        const x = pl + i * slot + (slot - barW) / 2;
        const y = yFor(b.amount);
        svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, pl > 0 ? (pt + ch - y) : 0).toFixed(1)}" fill="${b.color}" rx="3"><title>${b.label}: ₹${b.amount.toLocaleString('en-IN')} (${b.count} invoice${b.count === 1 ? '' : 's'})</title></rect>`;
        if (b.amount > 0) svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 5).toFixed(1)}" font-size="11" fill="#334155" text-anchor="middle" font-weight="600">₹${formatCompactINR(b.amount)}</text>`;
        svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${height - pb + 18}" font-size="11" fill="#64748b" text-anchor="middle">${b.label}</text>`;
        svg += `<text x="${(x + barW / 2).toFixed(1)}" y="${height - pb + 32}" font-size="10" fill="#94a3b8" text-anchor="middle">${b.count} inv</text>`;
    });
    svg += `<line x1="${pl}" y1="${pt}" x2="${pl}" y2="${pt + ch}" stroke="#cbd5e1" /><line x1="${pl}" y1="${pt + ch}" x2="${width - pr}" y2="${pt + ch}" stroke="#cbd5e1" />`;
    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; height:100%;" preserveAspectRatio="xMidYMid meet">${svg}</svg>`;
}

function renderAgeingCard(type) {
    const isPurchase = type === 'purchase';
    const d = getAgeingData(type);
    const fmt = v => '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
    const title = isPurchase ? 'Payable Report with Ageing' : 'Receivable Report with Ageing';
    const l1 = isPurchase ? 'Purchases' : 'Sales';
    const l2 = isPurchase ? 'Payments Made' : 'Receipts Received';
    const l3 = isPurchase ? 'Payment Payable' : 'Payment Receivable';
    const c1 = isPurchase ? '#ea580c' : '#16a34a';
    return `
        <div class="card">
            <h3 style="font-size: 16px; margin-bottom: 4px;">${title}</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">${l1} vs ${l2} — ageing of outstanding balance from invoice date</p>
            <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px;">

function importClients(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const text = e.target.result;
            const rows = text.split('\n').filter(r => r.trim());
            const headers = rows[0].split(',');
            const newRows = [];

            rows.slice(1).forEach((row) => {
                const values = row.split(',');
                const obj = {};
                headers.forEach((h, i) => {
                    obj[h.trim()] = values[i] ? values[i].trim() : '';
                });
                
                if (obj.name || obj.Name) {
                    newRows.push({
                        ...appClientToDb({
                            name: obj.name || obj.Name || '',
                            email: obj.email || obj.Email || '',
                            phone: obj.phone || obj.Phone || '',
                            gstNo: obj.gstNo || obj['GST No'] || '',
                            panNo: obj.panNo || obj['PAN No'] || '',
                            state: obj.state || obj.State || '',
                            stateCode: (INDIAN_STATES.find(s => s.name === (obj.state || obj.State)) || {}).code || '',
                            address: obj.address || obj.Address || ''
                        }),
                        created_by: currentUid()
                    });
                }
            });
            if (!newRows.length) { alert('No valid rows found to import'); return; }
            const { data: inserted, error } = await sb.from('clients').insert(newRows).select();
            if (error) { alert('Error importing clients: ' + error.message); return; }
            state.clients.push(...inserted.map(dbClientToApp));
            alert('Clients imported successfully!');
            renderApp();
        } catch (err) {
            alert('Error importing file: ' + err.message);
        }
    };
    reader.readAsText(file);
}

function importPurchases(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = async function(e) {
        try {
            const text = e.target.result;
            const rows = text.split('\n').filter(r => r.trim());
            const headers = rows[0].split(',');
            const newRows = [];
            let skipped = 0;
            
            rows.slice(1).forEach((row) => {
                const values = row.split(',');
                const obj = {};
                headers.forEach((h, i) => {
                    obj[h.trim()] = values[i] ? values[i].trim() : '';
                });
                
                const vendorName = obj.vendor || obj.Vendor || '';
                if (vendorName) {
                    const matchedVendor = state.vendors.find(v => v.name.toLowerCase() === vendorName.toLowerCase());
                    if (!matchedVendor) { skipped++; return; } // vendor_id is required by the database schema
                    const taxableValue = parseFloat(obj.taxableValue || obj['Taxable Value'] || obj.amount || obj.Amount || 0);
                    const gstAmount = parseFloat(obj.gstAmount || obj['GST Amount'] || 0);
                    newRows.push({
                        ...appTxnToDb({
                            type: 'purchase',
                            date: new Date().toISOString().split('T')[0],
                            vendorId: matchedVendor.id,
                            vendor: vendorName,
                            taxableValue: round2(taxableValue),
                            gstRate: 0,
                            gstAmount: round2(gstAmount),
                            cgst: 0, sgst: 0, igst: round2(gstAmount),
                            amount: round2(taxableValue + gstAmount),
                            invoiceNo: obj.invoiceNo || obj['Invoice No'] || '',
                            reference: obj.reference || obj.Reference || '',
                            description: obj.description || obj.Description || ''
                        }),
                        created_by: currentUid()
                    });
                }
            });
            if (!newRows.length) { alert(skipped ? `No rows imported — ${skipped} row(s) skipped (vendor name did not match an existing vendor).` : 'No valid rows found to import'); return; }
            const { data: inserted, error } = await sb.from('transactions').insert(newRows).select();
            if (error) { alert('Error importing purchases: ' + error.message); return; }
            state.transactions.push(...inserted.map(dbTxnToApp));
            alert('Purchases imported successfully!' + (skipped ? ` (${skipped} row(s) skipped — vendor not found)` : ''));
            renderApp();
        } catch (err) {
            alert('Error importing file: ' + err.message);
        }
    };
    reader.readAsText(file);
}

// Shared by the on-screen ledger and the WhatsApp statement share, so both always agree.
// fromDate/toDate are 'YYYY-MM-DD' strings or '' for no bound (inclusive range).
function computeLedgerStatement(ledgerType, partyId, fromDate, toDate) {
    const party = ledgerType === 'vendor' ? state.vendors : state.clients;
    const p = party.find(x => x.id === partyId);
    if (!p) return null;
    
    // Vendor ledger: this party's purchase entries only. Client ledger: their sales entries
    // (with a name-match fallback for legacy/imported rows that predate the clientId/vendorId link).
    const all = (ledgerType === 'vendor'
        ? state.transactions.filter(t => t.type === 'purchase' && (t.vendorId === p.id || t.vendor === p.name))
        : state.transactions.filter(t => t.type === 'sales' && (t.clientId === p.id || t.customer === p.name))
    ).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    
    let opening = 0;
    if (fromDate) {
        all.filter(t => (t.date || '') < fromDate).forEach(t => {
            opening += t.type === 'sales' ? (parseFloat(t.amount) || 0) : -(parseFloat(t.amount) || 0);
        });
    }
    
    const inRange = all.filter(t => (!fromDate || (t.date || '') >= fromDate) && (!toDate || (t.date || '') <= toDate));
    let running = opening;
    const rows = inRange.map(t => {
        // Sales invoice = client owes us (Debit). Purchase entry = we owe the vendor (Credit).
        running += t.type === 'sales' ? (parseFloat(t.amount) || 0) : -(parseFloat(t.amount) || 0);
        return { ...t, running };
    });
    
    return { party: p, rows, opening, closing: running };
}

                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <p style="margin-top: 12px; font-weight: 600;">
                    Closing Balance: ₹${Math.abs(closing).toLocaleString('en-IN', { maximumFractionDigits: 2 })} ${closing >= 0 ? 'Dr (Receivable)' : 'Cr (Payable)'}
                </p>
            `}
        </div>
    `;
}

// Sends the party's ledger statement (respecting the From/To date filter above) as a WhatsApp
// message to their registered phone number. Long statements are summarized past 20 entries,
// since WhatsApp's click-to-chat link only pre-fills text, not an attached file.
function shareLedgerOnWhatsApp() {
    const ledgerType = state.ledgerType || 'client';
    const party = ledgerType === 'vendor' ? state.vendors : state.clients;
    const partyId = state.ledgerPartyId || party[0]?.id;
    const fromDate = state.ledgerFromDate || '';
    const toDate = state.ledgerToDate || '';
    const data = computeLedgerStatement(ledgerType, partyId, fromDate, toDate);
    if (!data) return;
    const { party: p, rows, opening, closing } = data;
    const periodText = (fromDate || toDate) ? `${fromDate || 'Beginning'} to ${toDate || 'Today'}` : 'All Time';
    
    let message = `Dear ${p.name},\n\n`
        + `Greetings from ${state.company.name || 'our office'}.\n`
        + `Here is your account statement (${periodText}):\n\n`
        + `Opening Balance: ₹${Math.abs(opening).toLocaleString('en-IN', { maximumFractionDigits: 2 })} ${opening >= 0 ? 'Dr' : 'Cr'}\n`;
    
    const shown = rows.slice(0, 20);
    shown.forEach(t => {
        message += `${t.date} - ${t.type === 'sales' ? 'Sales' : 'Purchase'} ${t.invoiceNo || t.reference || ''} - ₹${parseFloat(t.amount || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}\n`;
    });
    if (rows.length > shown.length) {
        message += `...+${rows.length - shown.length} more entries (view full statement in the app)\n`;
    }
    
    message += `\nClosing Balance: ₹${Math.abs(closing).toLocaleString('en-IN', { maximumFractionDigits: 2 })} ${closing >= 0 ? 'Dr (Receivable)' : 'Cr (Payable)'}\n\nThank you.`;
    
    openWhatsAppShare(p.phone, message, ledgerType === 'vendor' ? 'vendor' : 'client');
}

async function addBankEntry(data) {
    const row = { ...appBankToDb(data), created_by: currentUid() };
    const { data: inserted, error } = await sb.from('bank_entries').insert(row).select().single();
    if (error) { alert('Error recording entry: ' + error.message); return; }
    if (!state.bankEntries) state.bankEntries = [];
    state.bankEntries.push(dbBankToApp(inserted));
    alert(data.type === 'receipt' ? 'Receipt recorded successfully!' : 'Payment recorded successfully!');
    renderApp();
}

function updateReceiptFromInvoice() {
    const id = document.getElementById('receipt_invoice').value;

    const t = state.transactions.find(tr => tr.id === id);

    document.getElementById('receipt_party').value = t.customer || '';

async function submitReceiptForm() {
    const invoiceId = document.getElementById('receipt_invoice').value;
    const party = document.getElementById('receipt_party').value;
    const date = document.getElementById('receipt_date').value || new Date().toISOString().split('T')[0];
    const amount = document.getElementById('receipt_amount').value;
    const mode = document.getElementById('receipt_mode').value;
    const reference = document.getElementById('receipt_ref').value;
    const narration = document.getElementById('receipt_narration').value;

    if (!party || !amount) {
        alert('Received From and Amount are required');
        return;
    }

    const payload = {
        type: 'receipt',
        linkedTransactionId: invoiceId || null,
        party,
        date,
        amount: round2(amount),
        mode,
        reference,
        narration
    };

    if (state.editingReceiptId) {
        const idx = state.bankEntries.findIndex(b => b.id === state.editingReceiptId);
        if (idx !== -1) {
            const { data: updated, error } = await sb.from('bank_entries').update(appBankToDb(payload)).eq('id', state.editingReceiptId).select().single();
            if (error) { alert('Error updating receipt: ' + error.message); return; }
            state.bankEntries[idx] = dbBankToApp(updated);
            alert('Receipt updated successfully!');
        }
        state.editingReceiptId = null;
        hideReceiptForm();
        renderApp();
        return;
    }

    await addBankEntry(payload);
    hideReceiptForm();
}

// ---- Settings (Firm Details + Logo) — admin-only tab next to Users ----

function renderSettingsPage() {
    if (state.currentUser.role !== 'admin') {
        return `<h2 class="page-title">Settings</h2><div class="card empty-state"><p>Only administrators can edit firm settings.</p></div>`;
    }
    const c = state.company;
    return `
        <h2 class="page-title">Settings</h2>
        <div class="card">
            <h3 style="margin-bottom: 16px;">Firm Details (appear on every tax invoice)</h3>
            <div class="form-grid">
                <input type="text" id="co_name" placeholder="Firm Name" value="${c.name || ''}">
                <input type="text" id="co_gstin" placeholder="GSTIN" value="${c.gstin || ''}">
                <input type="text" id="co_pan" placeholder="PAN" value="${c.pan || ''}">
                <select id="co_state" class="select-dropdown">
                    ${INDIAN_STATES.map(s => `<option value="${s.name}" data-code="${s.code}" ${c.state === s.name ? 'selected' : ''}>${s.name}</option>`).join('')}
                </select>
                <input type="text" id="co_email" placeholder="Email" value="${c.email || ''}">
                <input type="text" id="co_phone" placeholder="Phone" value="${c.phone || ''}">
                <input type="text" id="co_bank_name" placeholder="Bank Name" value="${c.bankName || ''}">
                <input type="text" id="co_bank_account" placeholder="Bank Account No" value="${c.bankAccount || ''}">
                <input type="text" id="co_bank_ifsc" placeholder="Bank IFSC" value="${c.bankIFSC || ''}">
            </div>
            <input type="text" id="co_address" placeholder="Registered Address" value="${c.address || ''}" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 16px;">
            
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Firm Logo (shown on invoices)</label>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div id="logo_preview_box" style="width: 100px; height: 60px; border: 1px dashed #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #f8fafc;">
                        ${c.logoDataUrl ? `<img id="logo_preview_img" src="${c.logoDataUrl}" style="max-width: 100%; max-height: 100%; object-fit: contain;">` : '<span style="font-size: 11px; color: #94a3b8;">No logo</span>'}
                    </div>
                    <input type="file" id="co_logo" accept="image/*" onchange="handleLogoUpload(event)">
                    ${c.logoDataUrl ? '<button class="btn" style="background-color: #fecaca; color: #991b1b; padding: 6px 12px; font-size: 12px;" onclick="removeLogo()">Remove</button>' : ''}
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="saveCompanyForm()">Save Firm Details</button>
        </div>
    `;
}

function handleLogoUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { alert('Please choose an image file'); return; }
    const reader = new FileReader();
    reader.onload = async function(e) {
        const { data: row, error } = await sb.from('company_settings').update({ logo_url: e.target.result }).eq('id', 1).select().single();
        if (error) { alert('Error saving logo: ' + error.message); return; }
        state.company = dbCompanyToApp(row);
        renderApp();
    };
    reader.readAsDataURL(file);
}

async function removeLogo() {
    const { data: row, error } = await sb.from('company_settings').update({ logo_url: null }).eq('id', 1).select().single();
    if (error) { alert('Error removing logo: ' + error.message); return; }
    state.company = dbCompanyToApp(row);
    renderApp();
}

async function saveCompanyForm() {
    const stateSelect = document.getElementById('co_state');
    const updatedCompany = {
        ...state.company,
        name: document.getElementById('co_name').value,
        gstin: document.getElementById('co_gstin').value,
        pan: document.getElementById('co_pan').value,
        state: stateSelect.value,
        stateCode: stateSelect.selectedOptions[0] ? stateSelect.selectedOptions[0].dataset.code || '' : '',
        email: document.getElementById('co_email').value,
        phone: document.getElementById('co_phone').value,
        bankName: document.getElementById('co_bank_name').value,
        bankAccount: document.getElementById('co_bank_account').value,
        bankIFSC: document.getElementById('co_bank_ifsc').value,
        address: document.getElementById('co_address').value
    };
    const { data: row, error } = await sb.from('company_settings').update(appCompanyToDb(updatedCompany)).eq('id', 1).select().single();
    if (error) { alert('Error saving firm details: ' + error.message); return; }
    state.company = dbCompanyToApp(row);
    alert('Firm details saved.');
    renderApp();
}

function renderInvoiceModal(transId) {

    const c = state.company;

    return `
        <div class="modal active">
            <div class="modal-content invoice-modal-content">
                <div class="invoice-doc" id="invoice_print_area">
                    <div class="inv-header">
                        <div style="display: flex; gap: 12px; align-items: flex-start;">
                            ${c.logoDataUrl ? `<img src="${c.logoDataUrl}" alt="Logo" style="height: 50px; max-width: 110px; object-fit: contain;">` : ''}
                            <div>
                                <div style="font-size: 18px; font-weight: bold;">${c.name || 'Firm Name'}</div>
                                <div>${c.address || ''}</div>
                                <div>${c.state ? 'State: ' + c.state : ''}</div>
                                <div>${c.gstin ? 'GSTIN: ' + c.gstin : ''}${c.pan ? ' &nbsp; PAN: ' + c.pan : ''}</div>
                                <div>${c.email || ''} ${c.phone ? '· ' + c.phone : ''}</div>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <div><strong>Invoice No:</strong> ${t.invoiceNo || '-'}</div>
                            <div><strong>Date:</strong> ${t.date}</div>
                            <div><strong>Place of Supply:</strong> ${client && client.state ? client.state : '-'}</div>
                        </div>
                    </div>
                    <div class="inv-title">TAX INVOICE</div>
                    <div class="inv-parties">
                        <div class="box">
                            <strong>Bill To:</strong><br>
                            ${client ? client.name : t.customer}<br>
                            ${client && client.address ? client.address + '<br>' : ''}
                            ${client && client.gstNo ? 'GSTIN: ' + client.gstNo + '<br>' : ''}
                            ${client && client.panNo ? 'PAN: ' + client.panNo + '<br>' : ''}
                            ${client && client.state ? 'State: ' + client.state : ''}
                        </div>
                        <div class="box">
                            <strong>Reference:</strong> ${t.reference || '-'}<br>
                            <strong>Description:</strong> ${t.description || '-'}
                        </div>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Description</th>
                                <th>HSN/SAC</th>
                                <th style="text-align: right;">Taxable Value</th>
                                ${t.igst ? '<th style="text-align: right;">IGST</th>' : '<th style="text-align: right;">CGST</th><th style="text-align: right;">SGST</th>'}
                                <th style="text-align: right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1</td>
                                <td>${t.description || 'Services rendered'}</td>
                                <td>${t.hsnCode || '-'}</td>
                                <td style="text-align: right;">₹${parseFloat(taxable || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
                                ${t.igst
                                    ? `<td style="text-align: right;">₹${parseFloat(t.igst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>`
                                    : `<td style="text-align: right;">₹${parseFloat(t.cgst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td><td style="text-align: right;">₹${parseFloat(t.sgst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>`}
                                <td style="text-align: right;">₹${parseFloat(t.amount || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="inv-totals">
                        <div><span>Taxable Value</span><span>₹${parseFloat(taxable || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span></div>
                        ${t.igst ? `<div><span>IGST${t.gstRate ? ' (' + t.gstRate + '%)' : ''}</span><span>₹${parseFloat(t.igst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span></div>`
                            : `<div><span>CGST${t.gstRate ? ' (' + (t.gstRate / 2) + '%)' : ''}</span><span>₹${parseFloat(t.cgst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span></div>
                               <div><span>SGST${t.gstRate ? ' (' + (t.gstRate / 2) + '%)' : ''}</span><span>₹${parseFloat(t.sgst || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</span></div>`}
                        <div style="border-top: 1px solid #1e293b; margin-top: 4px; padding-top: 4px;"><strong>Grand Total</strong><strong>₹${parseFloat(t.amount || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}</strong></div>

                    <div class="inv-footer">

                            Authorized Signatory

                    <button onclick="closeInvoiceModal()" style="background-color: #e2e8f0; color: #475569;">Close</button>
                </div>
            </div>
        </div>
    `;
}

function printInvoice(transId) {
    const content = document.getElementById('invoice_print_area').innerHTML;
    const w = window.open('', '_blank');
    w.document.write(`
        <html><head><title>Invoice</title>
        <style>
            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 24px; color: #1e293b; font-size: 13px; }
            table { width: 100%; border-collapse: collapse; font-size: 12px; }
            th, td { padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: left; }
            .inv-header { display: flex; justify-content: space-between; border-bottom: 2px solid #1e293b; padding-bottom: 12px; margin-bottom: 12px; }
            .inv-title { text-align: center; font-weight: bold; font-size: 16px; letter-spacing: 1px; margin: 12px 0; }
            .inv-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 12px; }
            .inv-parties .box { border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px; }
            .inv-totals { margin-top: 8px; width: 100%; max-width: 320px; margin-left: auto; }
            .inv-totals div { display: flex; justify-content: space-between; padding: 4px 0; }
            .inv-footer { margin-top: 24px; display: flex; justify-content: space-between; font-size: 12px; color: #475569; }
        </style>
        </head><body>${content}</body></html>
    `);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 250);
}

// Sends the invoice summary as a WhatsApp message to the client's registered phone number
// (WhatsApp's click-to-chat link supports pre-filled text only — the client still opens the
// invoice/PDF from Print/Download; there is no way to auto-attach a file without WhatsApp Business API).
function shareInvoiceOnWhatsApp(transId) {
    const t = state.transactions.find(x => x.id === transId);
    if (!t) return;
    const client = state.clients.find(c => c.id === t.clientId);
    const c = state.company;
    const message = `Dear ${client ? client.name : t.customer},\n\n`
        + `Greetings from ${c.name || 'our office'}.\n`
        + `Please find your invoice details below:\n\n`
        + `Invoice No: ${t.invoiceNo || '-'}\n`
        + `Date: ${t.date}\n`
        + `Amount: ₹${parseFloat(t.amount || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 })}\n`
        + `${t.description ? 'Particulars: ' + t.description + '\n' : ''}`
        + `\nThank you for your business.`;
    openWhatsAppShare(client ? client.phone : '', message, 'client');
}
